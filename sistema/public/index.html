<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Gestão de Tarefas</title>

</head>

<body>
  <main class="login">
    <div class="painel">
      <h1>Gestão de Tarefas</h1>
      <p class="vazio">Entre com seu e-mail e senha para acessar o sistema.</p>
      <form id="form">
        <label>E-mail<input type="email" id="email" required autofocus></label>
        <label>Senha<input type="password" id="senha" required></label>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <div id="msg" class="msg" role="alert"></div>
    </div>
  </main>
  <script>
    if (localStorage.token) location.href = 'app.html';
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('msg'); msg.textContent = ''; msg.className = 'msg';
      try {
        const r = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim(), senha: senha.value })
        });
        const d = await r.json();
        if (!r.ok) { msg.textContent = d.erro; msg.className = 'msg erro'; return; }
        localStorage.token = d.token; localStorage.nome = d.nome;
        location.href = 'app.html';
      } catch { msg.textContent = 'Não foi possível conectar ao servidor.'; msg.className = 'msg erro'; }
    });
  </script>
</body>

</html>
